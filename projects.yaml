# Subject projects. Every case of a project uses the same commit.
#
# eval_maven_args: added to the build and test commands of the evaluation (verification, tracing,
# PIT) and of rendered-raw, never to the commands of the agent. They switch off code-format checks
# bound to early Maven phases, so that the format of a generated test does not decide whether it
# compiles; the agent modes still see the project's checks through their own commands.

apollo:
  url: https://github.com/apolloconfig/apollo.git
  commit: 998b88f100d5ba8dd4af16a0eb1d008b513cca70
  jdk: 21
  license: Apache-2.0

