  url: https://github.com/Aiven-Open/klaw.git
  commit: 99f895322296ef5cbfcfb42684add6c52fe6e057
  jdk: 21
  license: Apache-2.0
  eval_maven_args: [-Dspotless.check.skip=true, -Dspotless.apply.skip=true]

