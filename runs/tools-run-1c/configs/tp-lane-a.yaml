# LANE tp-lane-a.yaml of tools-run-1c (projects: pdfbox): microtestcarver with the
# full classpath of the target module (docs/tools.md), round 1, verify/rq1/quality (no rq2), 2 cells at once.
provider:
  name: gateway
  base_url: https://<provider>/v1
  api_key_env: TESTGEN_API_KEY
  fallback_api_key_env: TESTGEN_API_KEY_FALLBACK
  models: []
model: OpenAI/gpt-6.1-sol
thinking: medium
timeout: 600
command_timeout: 900
case_list: tools-projects.csv
jdk: 11
modes: []
once_modes:
- microtestcarver
rounds:
- 1
run_id_format: r{round}
cases:
- pdfbox-catalog-get-viewer-preferences
- pdfbox-cid-font-get-cid-system-info
- pdfbox-cid-system-info-get-ordering
- pdfbox-cos-parser-get-encryption
- pdfbox-default-resource-cache-get-font
- pdfbox-ext-graphics-state-get-soft-mask
- pdfbox-font-descriptor-get-flags
- pdfbox-font-descriptor-is-fixed-pitch
- pdfbox-font-descriptor-is-symbolic
- pdfbox-icc-based-get-default-decode
- pdfbox-image-xobject-get-color-key-mask
- pdfbox-image-xobject-get-interpolate
- pdfbox-resources-get-ext-gstate
- pdfbox-xref-trailer-resolver-get-xref-type
parallel_cases: 2
min_free_disk_gb: 15
min_free_mem_gb: 3
paths:
  projects: /<home>/repos/tools-projects/projects
  results: /<root>/results/tools-mtc-1c-tools-projects
  work: /<root>/tools-run-1c/work-tp-a
  tools: /<home>/repos/tools-projects/tools
  java_home: /<root>/newcases/jdks/jdk-11.0.32.1+1
  maven_repository: /<root>/newcases/m2
  external_tools: /<root>/tools-run/external
evaluation:
  steps:
  - verify
  - rq1
  - quality
  reference_runs: 2
  trace_depth: 5
env:
  HOME: /<home>/repos/tools-projects/home
  TMPDIR: /<root>/tools-run/tmp
  MAVEN_OPTS: -Xmx2g -Djava.io.tmpdir=/<root>/tools-run/tmp -Duser.home=/<home>/repos/tools-projects/home -Dmaven.repo.local=/<root>/newcases/m2
  MAVEN_ARGS: -Dmaven.repo.local=/<root>/newcases/m2
  JDK_JAVA_OPTIONS: --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED
    --add-opens java.base/java.text=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED
    --add-opens java.base/java.util.concurrent.locks=ALL-UNNAMED --add-opens java.base/java.util.concurrent.atomic=ALL-UNNAMED
    --add-opens java.base/java.lang.ref=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/java.math=ALL-UNNAMED
    --add-opens java.base/java.nio=ALL-UNNAMED --add-opens java.base/java.nio.charset=ALL-UNNAMED --add-opens java.base/java.time=ALL-UNNAMED
    --add-opens java.base/sun.nio.cs=ALL-UNNAMED --add-opens java.base/java.security=ALL-UNNAMED --add-opens java.base/jdk.internal.misc=ALL-UNNAMED
    --add-opens java.base/jdk.internal.ref=ALL-UNNAMED --add-opens java.sql/java.sql=ALL-UNNAMED --add-opens java.desktop/java.awt.font=ALL-UNNAMED
tool_timeout: 2400
