# Full run of the autonomous mode on the 31 cases of cases/tools-projects.csv (JDK 11), same settings.
# References: copied from results/tools-projects/references (recorded after the JDK 11 caller fix).
provider:
  name: gateway
  base_url: https://<openai-compatible-gateway>/v1
  api_key_env: TESTGEN_API_KEY
  fallback_api_key_env: TESTGEN_API_KEY_FALLBACK
  models: []
model: OpenAI/gpt-6.1-sol
thinking: medium
timeout: 600
command_timeout: 900
case_list: tools-projects.csv
jdk: 11
modes:
- autonomous
once_modes: []
rounds:
- 1
- 2
run_id_format: r{round}
cases: []
parallel_cases: 1
min_free_disk_gb: 15
min_free_mem_gb: 3
paths:
  projects: /<home>/repos/tools-projects/projects
  results: /<home>/repos/results/autonomous-tools-projects
  work: /<home>/repos/full-run/work-tp
  tools: /<home>/repos/tools-projects/tools
  java_home: /<home>/newcases/jdks/jdk-11.0.32.1+1
  maven_repository: /<home>/newcases/m2
  debug_ports: 5300-5399
evaluation:
  steps:
  - verify
  - rq1
  - rq2
  - quality
  reference_runs: 2
  trace_depth: 5
env:
  HOME: /<home>/repos/tools-projects/home
  TMPDIR: /<home>/repos/tools-projects/tmp
  MAVEN_OPTS: -Xmx2g -Djava.io.tmpdir=/<home>/repos/tools-projects/tmp -Duser.home=/<home>/repos/tools-projects/home
    -Dmaven.repo.local=/<home>/newcases/m2
  MAVEN_ARGS: -Dmaven.repo.local=/<home>/newcases/m2
debug_runs: 3
