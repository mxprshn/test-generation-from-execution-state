# komar-run-1, group 70: settings of autonomous-run-1, mode komar, rounds 1-2, no PIT; one case per run.py call (scripts/worker.sh); tag komar-run-1b
provider:
  name: gateway
  base_url: https://<openai-compatible-gateway>/v1
  api_key_env: TESTGEN_API_KEY
  fallback_api_key_env: TESTGEN_API_KEY_FALLBACK
  models: []
model: OpenAI/gpt-6.1-sol
thinking: medium
timeout: 600
command_timeout: 900
modes:
- komar
once_modes: []
rounds:
- 1
- 2
run_id_format: r{round}
parallel_cases: 1
min_free_disk_gb: 15
min_free_mem_gb: 3
paths:
  projects: /<root>/setup-check/projects
  results: /<root>/results/komar-v2
  work: /<root>/komar-run/work/w4
  tools: /<root>/autonomous-trial/tools
  java_home: /<root>/jdk21
  maven_repository: /<root>/setup-check/m2
  debug_ports: 5500-5599
  komar: /<root>/komar-run/komar
evaluation:
  steps:
  - verify
  - rq1
  - quality
  reference_runs: 2
  trace_depth: 5
env:
  HOME: /<root>/home
  TMPDIR: /<root>/komar-run/tmp
  MAVEN_OPTS: -Xmx2g -Djava.io.tmpdir=/<root>/komar-run/tmp -Duser.home=/<root>/home
    -Dmaven.repo.local=/<root>/setup-check/m2
  MAVEN_ARGS: -Dmaven.repo.local=/<root>/setup-check/m2
cases:
- apollo-access-key-service-create
- apollo-app-namespace-service-create-default-app-namespace
- apollo-cluster-service-delete
