# komar-run-1, group 31: settings of autonomous-run-1, mode komar, rounds 1-2, no PIT; one case per run.py call (scripts/worker.sh); tag komar-run-1b
provider:
  name: gateway
  base_url: https://<openai-compatible-gateway>/v1
  api_key_env: TESTGEN_API_KEY
  fallback_api_key_env: TESTGEN_API_KEY_FALLBACK
  models: []
model: OpenAI/gpt-6.1-sol
thinking: medium
timeout: 600
command_timeout: 900
case_list: tools-projects.csv
jdk: 11
modes:
- komar
once_modes: []
rounds:
- 1
- 2
run_id_format: r{round}
cases:
- gh-base-graph-nodes-and-edges-load-existing
- gh-douglas-peucker-set-max-distance
- gh-graphhopper-storage-load-existing
- gh-int-encoded-value-impl-init
- gh-line-int-index-load-existing
- gh-storable-properties-load-existing
- gh-string-index-load-existing
- gh-virtual-edge-iterator-state-get-reverse
- lab-calculate-price-handler-handle
- pdfbox-catalog-get-viewer-preferences
- pdfbox-cid-font-get-cid-system-info
- pdfbox-cid-system-info-get-ordering
- pdfbox-cos-parser-get-encryption
- pdfbox-default-resource-cache-get-font
- pdfbox-ext-graphics-state-get-soft-mask
- pdfbox-font-descriptor-get-flags
- pdfbox-font-descriptor-is-fixed-pitch
- pdfbox-font-descriptor-is-symbolic
- pdfbox-icc-based-get-default-decode
- pdfbox-image-xobject-get-color-key-mask
- pdfbox-image-xobject-get-interpolate
- pdfbox-resources-get-ext-gstate
- pdfbox-xref-trailer-resolver-get-xref-type
- petclinic-base-entity-is-new
- petclinic-named-entity-to-string
- petclinic-owner-add-visit
- petclinic-owner-get-pet-by-name
- petclinic-owner-get-pet
- petclinic-pet-type-formatter-parse
- petclinic-pet-validator-validate
- petclinic-vets-get-vet-list
parallel_cases: 1
min_free_disk_gb: 15
min_free_mem_gb: 3
paths:
  projects: /<root>/tools-projects/projects
  results: /<root>/results/komar-tools-projects
  work: /<root>/komar-run/work/w4
  tools: /<root>/tools-projects/tools
  java_home: /<home>/newcases/jdks/jdk-11.0.32.1+1
  maven_repository: /<home>/newcases/m2
  debug_ports: 5500-5599
  komar: /<root>/komar-run/komar
evaluation:
  steps:
  - verify
  - rq1
  - quality
  reference_runs: 2
  trace_depth: 5
env:
  HOME: /<root>/tools-projects/home
  TMPDIR: /<root>/tools-projects/tmp
  MAVEN_OPTS: -Xmx2g -Djava.io.tmpdir=/<root>/tools-projects/tmp -Duser.home=/<root>/tools-projects/home
    -Dmaven.repo.local=/<home>/newcases/m2
  MAVEN_ARGS: -Dmaven.repo.local=/<home>/newcases/m2
debug_runs: 3
