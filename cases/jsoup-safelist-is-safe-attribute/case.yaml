id: jsoup-safelist-is-safe-attribute
project: jsoup
group: indirect
target:
  class: org.jsoup.safety.Safelist
  method: isSafeAttribute
  signature: (java.lang.String, org.jsoup.nodes.Element, org.jsoup.nodes.Attribute) -> boolean
scenario:
  test: org.jsoup.safety.CleanerTest#basicWithImagesTest
  source: src/test/java/org/jsoup/safety/CleanerTest.java
output_test_file: src/test/java/org/jsoup/safety/SafelistCarvedTest.java
hidden_paths:
- src/test/java/org/jsoup/safety/SafelistTest.java
- src/test/java/org/jsoup/integration/SafelistExtensionTest.java
commands:
  build: [mvn, -q, -o, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -Dtest=CleanerTest#basicWithImagesTest, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -Dtest=SafelistCarvedTest, -Dsurefire.failIfNoSpecifiedTests=false, test]
