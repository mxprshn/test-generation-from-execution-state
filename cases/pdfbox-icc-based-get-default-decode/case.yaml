id: pdfbox-icc-based-get-default-decode
project: pdfbox
group: indirect
target:
  class: org.apache.pdfbox.pdmodel.graphics.color.PDICCBased
  method: getDefaultDecode
  signature: '(int) -> float[]'
scenario:
  test: org.apache.pdfbox.pdmodel.graphics.image.PNGConverterTest#testImageConversionRGB16BitICC
  source: pdfbox/src/test/java/org/apache/pdfbox/pdmodel/graphics/image/PNGConverterTest.java
output_test_file: pdfbox/src/test/java/org/apache/pdfbox/pdmodel/graphics/color/PDICCBasedCarvedTest.java
hidden_paths:
- pdfbox/src/test/java/org/apache/pdfbox/pdmodel/graphics/color/PDICCBasedTest.java
commands:
  build: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=PNGConverterTest#testImageConversionRGB16BitICC, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=PDICCBasedCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
