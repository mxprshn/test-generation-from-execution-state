id: jsoup-node-abs-url
project: jsoup
group: direct
target:
  class: org.jsoup.nodes.Node
  method: absUrl
  signature: (java.lang.String) -> java.lang.String
scenario:
  test: org.jsoup.parser.HtmlParserTest#handlesBaseTags
  source: src/test/java/org/jsoup/parser/HtmlParserTest.java
output_test_file: src/test/java/org/jsoup/nodes/NodeAbsUrlCarvedTest.java
hidden_paths:
- src/test/java/org/jsoup/nodes/NodeTest.java
commands:
  build: [mvn, -q, -o, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -Dtest=HtmlParserTest#handlesBaseTags, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -Dtest=NodeAbsUrlCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
