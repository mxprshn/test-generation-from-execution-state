id: pdfbox-cid-font-get-cid-system-info
project: pdfbox
group: indirect
target:
  class: org.apache.pdfbox.pdmodel.font.PDCIDFont
  method: getCIDSystemInfo
  signature: () -> org.apache.pdfbox.pdmodel.font.PDCIDSystemInfo
scenario:
  test: org.apache.pdfbox.pdmodel.font.PDFontTest#testSoftHyphen
  source: pdfbox/src/test/java/org/apache/pdfbox/pdmodel/font/PDFontTest.java
output_test_file: pdfbox/src/test/java/org/apache/pdfbox/pdmodel/font/PDCIDFontCarvedTest.java
hidden_paths: []
commands:
  build: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=PDFontTest#testSoftHyphen, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=PDCIDFontCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
