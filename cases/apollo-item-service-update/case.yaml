  scenario: [mvn, -q, -o, -pl, apollo-biz, -am, -Dtest=ItemSetServiceTest, -Dsurefire.failIfNoSpecifiedTests=false, -DfailIfNoTests=false, -Dexec.skip=true, test]
  generated_test: [mvn, -q, -o, -pl, apollo-biz, -am, -Dtest=ItemServiceUpdateCarvedTest, -Dsurefire.failIfNoSpecifiedTests=false, -DfailIfNoTests=false, -Dexec.skip=true, test]
