id: pdfbox-cos-parser-get-encryption
project: pdfbox
group: indirect
target:
  class: org.apache.pdfbox.pdfparser.COSParser
  method: getEncryption
  signature: () -> org.apache.pdfbox.pdmodel.encryption.PDEncryption
scenario:
  test: org.apache.pdfbox.multipdf.MergeAcroFormsTest#testJoinFieldsMerge_TextFieldsOnly_SameMerged
  source: pdfbox/src/test/java/org/apache/pdfbox/multipdf/MergeAcroFormsTest.java
output_test_file: pdfbox/src/test/java/org/apache/pdfbox/pdfparser/COSParserCarvedTest.java
hidden_paths: []
commands:
  build: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=MergeAcroFormsTest#testJoinFieldsMerge_TextFieldsOnly_SameMerged, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=COSParserCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
