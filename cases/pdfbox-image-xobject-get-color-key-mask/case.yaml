  method: getColorKeyMask
  signature: () -> org.apache.pdfbox.cos.COSArray
scenario:
  test: org.apache.pdfbox.pdmodel.graphics.image.JPEGFactoryTest#testCreateFromImageINT_ARGB
  source: pdfbox/src/test/java/org/apache/pdfbox/pdmodel/graphics/image/JPEGFactoryTest.java
