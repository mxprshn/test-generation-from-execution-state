id: jgit-path-matcher-matches
project: jgit
group: indirect
target:
  class: org.eclipse.jgit.ignore.internal.PathMatcher
  method: matches
  signature: (java.lang.String, boolean, boolean) -> boolean
scenario:
  test: org.eclipse.jgit.ignore.IgnoreMatcherParametrizedTest#testDirModeAndRegex1
  source: org.eclipse.jgit.test/tst/org/eclipse/jgit/ignore/IgnoreMatcherParametrizedTest.java
output_test_file: org.eclipse.jgit.test/tst/org/eclipse/jgit/ignore/internal/PathMatcherCarvedTest.java
hidden_paths:
- org.eclipse.jgit.test/tst/org/eclipse/jgit/ignore/FastIgnoreRuleTest.java
commands:
  build: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=IgnoreMatcherParametrizedTest#testDirModeAndRegex1, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false,
    test]
  generated_test: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=PathMatcherCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
