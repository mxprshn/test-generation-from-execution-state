id: jgit-merger-merge
project: jgit
group: direct
target:
  class: org.eclipse.jgit.merge.Merger
  method: merge
  signature: (org.eclipse.jgit.lib.AnyObjectId[]) -> boolean
scenario:
  test: org.eclipse.jgit.merge.MergerTest#failingDeleteOfDirectoryWithUntrackedContent
  source: org.eclipse.jgit.test/tst/org/eclipse/jgit/merge/MergerTest.java
output_test_file: org.eclipse.jgit.test/tst/org/eclipse/jgit/merge/MergerCarvedTest.java
hidden_paths: []
commands:
  build: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=MergerTest#failingDeleteOfDirectoryWithUntrackedContent, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false,
    test]
  generated_test: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=MergerCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
