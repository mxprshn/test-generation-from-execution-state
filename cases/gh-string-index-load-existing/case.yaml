id: gh-string-index-load-existing
project: graphhopper
group: indirect
target:
  class: com.graphhopper.search.StringIndex
  method: loadExisting
  signature: () -> boolean
scenario:
  test: com.graphhopper.GraphHopperTest#testImportThenLoadFlexible
  source: core/src/test/java/com/graphhopper/GraphHopperTest.java
output_test_file: core/src/test/java/com/graphhopper/search/StringIndexCarvedTest.java
hidden_paths:
- core/src/test/java/com/graphhopper/search/StringIndexTest.java
commands:
  build: [mvn, -q, -o, -pl, core, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, core, -Dtest=GraphHopperTest#testImportThenLoadFlexible, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -pl, core, -Dtest=StringIndexCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
