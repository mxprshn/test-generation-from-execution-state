id: jgit-checkout-command-call
project: jgit
group: direct
target:
  class: org.eclipse.jgit.api.CheckoutCommand
  method: call
  signature: () -> org.eclipse.jgit.lib.Ref
scenario:
  test: org.eclipse.jgit.symlinks.SymlinksTest#fileModeTestMissingThenSymlink
  source: org.eclipse.jgit.test/tst/org/eclipse/jgit/symlinks/SymlinksTest.java
output_test_file: org.eclipse.jgit.test/tst/org/eclipse/jgit/api/CheckoutCommandCarvedTest.java
hidden_paths:
- org.eclipse.jgit.test/tst/org/eclipse/jgit/api/CheckoutCommandTest.java
commands:
  build: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=SymlinksTest#fileModeTestMissingThenSymlink, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false,
    test]
  generated_test: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=CheckoutCommandCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
