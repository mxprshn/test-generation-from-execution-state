id: jgit-config-to-text
project: jgit
group: direct
target:
  class: org.eclipse.jgit.lib.Config
  method: toText
  signature: () -> java.lang.String
scenario:
  test: org.eclipse.jgit.submodule.SubmoduleWalkTest#indexWithGitmodules
  source: org.eclipse.jgit.test/tst/org/eclipse/jgit/submodule/SubmoduleWalkTest.java
output_test_file: org.eclipse.jgit.test/tst/org/eclipse/jgit/lib/ConfigCarvedTest.java
hidden_paths:
- org.eclipse.jgit.test/tst/org/eclipse/jgit/lib/ConfigTest.java
- org.eclipse.jgit.test/tst/org/eclipse/jgit/lib/CommitTemplateConfigTest.java
commands:
  build: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=SubmoduleWalkTest#indexWithGitmodules, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=ConfigCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
