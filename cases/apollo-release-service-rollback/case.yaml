id: apollo-release-service-rollback
project: apollo
group: direct
target:
  class: com.ctrip.framework.apollo.biz.service.ReleaseService
  method: rollback
  signature: (long, java.lang.String) -> com.ctrip.framework.apollo.biz.entity.Release
scenario:
  test: com.ctrip.framework.apollo.biz.service.ReleaseCreationTest
  source: apollo-biz/src/test/java/com/ctrip/framework/apollo/biz/service/ReleaseCreationTest.java
output_test_file: apollo-biz/src/test/java/com/ctrip/framework/apollo/biz/service/ReleaseServiceRollbackCarvedTest.java
hidden_paths:
- apollo-biz/src/test/java/com/ctrip/framework/apollo/biz/service/ReleaseServiceTest.java
commands:
  build: [mvn, -q, -o, -pl, apollo-biz, -am, -DskipTests, -Dexec.skip=true, test-compile]
  scenario: [mvn, -q, -o, -pl, apollo-biz, -am, -Dtest=ReleaseCreationTest, -Dsurefire.failIfNoSpecifiedTests=false, -DfailIfNoTests=false, -Dexec.skip=true, test]
  generated_test: [mvn, -q, -o, -pl, apollo-biz, -am, -Dtest=ReleaseServiceRollbackCarvedTest, -Dsurefire.failIfNoSpecifiedTests=false, -DfailIfNoTests=false, -Dexec.skip=true, test]
