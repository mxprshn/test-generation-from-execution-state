id: pdfbox-font-descriptor-is-fixed-pitch
project: pdfbox
group: indirect
target:
  class: org.apache.pdfbox.pdmodel.font.PDFontDescriptor
  method: isFixedPitch
  signature: () -> boolean
scenario:
  test: org.apache.pdfbox.pdfwriter.ContentStreamWriterTest#testPDFBox4750
  source: pdfbox/src/test/java/org/apache/pdfbox/pdfwriter/ContentStreamWriterTest.java
output_test_file: pdfbox/src/test/java/org/apache/pdfbox/pdmodel/font/PDFontDescriptorCarvedTest.java
hidden_paths: []
commands:
  build: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=ContentStreamWriterTest#testPDFBox4750, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=PDFontDescriptorCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
