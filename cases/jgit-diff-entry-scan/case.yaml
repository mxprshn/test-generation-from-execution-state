id: jgit-diff-entry-scan
project: jgit
group: indirect
target:
  class: org.eclipse.jgit.diff.DiffEntry
  method: scan
  signature: (org.eclipse.jgit.treewalk.TreeWalk, boolean, org.eclipse.jgit.treewalk.filter.TreeFilter[]) -> java.util.List<org.eclipse.jgit.diff.DiffEntry>
scenario:
  test: org.eclipse.jgit.diff.PatchIdDiffFormatterTest
  source: org.eclipse.jgit.test/tst/org/eclipse/jgit/diff/PatchIdDiffFormatterTest.java
output_test_file: org.eclipse.jgit.test/tst/org/eclipse/jgit/diff/DiffEntryCarvedTest.java
hidden_paths:
- org.eclipse.jgit.test/tst/org/eclipse/jgit/diff/DiffEntryTest.java
commands:
  build: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=PatchIdDiffFormatterTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=DiffEntryCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
