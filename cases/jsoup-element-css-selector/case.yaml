id: jsoup-element-css-selector
project: jsoup
group: direct
target:
  class: org.jsoup.nodes.Element
  method: cssSelector
  signature: () -> java.lang.String
scenario:
  test: org.jsoup.select.QueryParserTest#parsesEscapedSubqueries
  source: src/test/java/org/jsoup/select/QueryParserTest.java
output_test_file: src/test/java/org/jsoup/nodes/ElementCssSelectorCarvedTest.java
hidden_paths:
- src/test/java/org/jsoup/nodes/ElementTest.java
commands:
  build: [mvn, -q, -o, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -Dtest=QueryParserTest#parsesEscapedSubqueries, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -Dtest=ElementCssSelectorCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
