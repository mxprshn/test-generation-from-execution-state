id: jgit-stash-create-call
project: jgit
group: direct
target:
  class: org.eclipse.jgit.api.StashCreateCommand
  method: call
  signature: () -> org.eclipse.jgit.revwalk.RevCommit
scenario:
  test: org.eclipse.jgit.api.StashApplyCommandTest#workingDirectoryModify
  source: org.eclipse.jgit.test/tst/org/eclipse/jgit/api/StashApplyCommandTest.java
output_test_file: org.eclipse.jgit.test/tst/org/eclipse/jgit/api/StashCreateCommandCarvedTest.java
hidden_paths:
- org.eclipse.jgit.test/tst/org/eclipse/jgit/api/StashCreateCommandTest.java
commands:
  build: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=StashApplyCommandTest#workingDirectoryModify, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false,
    test]
  generated_test: [mvn, -q, -o, -pl, org.eclipse.jgit.test, -am, -Dtest=StashCreateCommandCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
