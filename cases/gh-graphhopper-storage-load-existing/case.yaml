  scenario: [mvn, -q, -o, -pl, core, -Dtest=GraphHopperTest#testDoNotInterpolateTwice1645, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
