- src/test/java/org/apache/ibatis/submitted/lazy_immutable
commands:
  build: [./mvnw, -Dlicense.skip=true, -q, -o, -DskipTests, test-compile]
  scenario: [./mvnw, -Dlicense.skip=true, -q, -o, -Dtest=LazyPropertiesTest#shouldLoadOnlyTheInvokedLazyProperty, -DfailIfNoTests=false, test]
  generated_test: [./mvnw, -Dlicense.skip=true, -q, -o, -Dtest=ResultLoaderCarvedTest, -DfailIfNoTests=false, test]
