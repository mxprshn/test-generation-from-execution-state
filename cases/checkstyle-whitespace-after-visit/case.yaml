  source: src/test/java/com/puppycrawl/tools/checkstyle/TreeWalkerTest.java
output_test_file: src/test/java/com/puppycrawl/tools/checkstyle/checks/whitespace/WhitespaceAfterCheckCarvedTest.java
hidden_paths:
- src/test/java/com/puppycrawl/tools/checkstyle/checks/whitespace/WhitespaceAfterCheckTest.java
commands:
  build: [mvn, -q, -o, -DskipTests, -Djacoco.skip=true, -Dexec.skip=true, test-compile]
