id: pdfbox-catalog-get-viewer-preferences
project: pdfbox
group: indirect
target:
  class: org.apache.pdfbox.pdmodel.PDDocumentCatalog
  method: getViewerPreferences
  signature: () -> org.apache.pdfbox.pdmodel.interactive.viewerpreferences.PDViewerPreferences
scenario:
  test: org.apache.pdfbox.multipdf.PageExtractorTest#testExtract
  source: pdfbox/src/test/java/org/apache/pdfbox/multipdf/PageExtractorTest.java
output_test_file: pdfbox/src/test/java/org/apache/pdfbox/pdmodel/PDDocumentCatalogCarvedTest.java
hidden_paths:
- pdfbox/src/test/java/org/apache/pdfbox/pdmodel/TestPDDocumentCatalog.java
commands:
  build: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=PageExtractorTest#testExtract, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=PDDocumentCatalogCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
