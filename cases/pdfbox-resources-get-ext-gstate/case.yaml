id: pdfbox-resources-get-ext-gstate
project: pdfbox
group: indirect
target:
  class: org.apache.pdfbox.pdmodel.PDResources
  method: getExtGState
  signature: (org.apache.pdfbox.cos.COSName) -> org.apache.pdfbox.pdmodel.graphics.state.PDExtendedGraphicsState
scenario:
  test: org.apache.pdfbox.pdmodel.interactive.form.AlignmentTest#fillFields
  source: pdfbox/src/test/java/org/apache/pdfbox/pdmodel/interactive/form/AlignmentTest.java
output_test_file: pdfbox/src/test/java/org/apache/pdfbox/pdmodel/PDResourcesCarvedTest.java
hidden_paths: []
commands:
  build: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -DskipTests, test-compile]
  scenario: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=AlignmentTest#fillFields, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
  generated_test: [mvn, -q, -o, -pl, pdfbox, -Drat.skip=true, -Danimal.sniffer.skip=true, -Dtest=PDResourcesCarvedTest, -Dsurefire.failIfNoTests=false, -DfailIfNoTests=false, -Dsurefire.failIfNoSpecifiedTests=false, test]
